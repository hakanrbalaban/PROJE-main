<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../bootstrap/icons/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <title>Giriş Yap - Social</title>
</head>

<body class="auth-bg">
  <div class="auth-page">
    <div class="auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-facebook text-primary" style="font-size: 50px;"></i>
      </div>
      <h1 class="text-center mb-3">Social</h1>
      <p class="text-center">Facebook'a benzeyen bir sosyal ağ.</p>

      <form id="loginForm" onsubmit="socialApp.handleLogin(event)">
        <input type="email" id="loginEmail" class="auth-input" placeholder="E-posta veya telefon" required>
        <input type="password" id="loginPassword" class="auth-input" placeholder="Şifre" required>
        <button type="submit" class="auth-btn">Giriş Yap</button>
      </form>

      <div class="auth-divider">veya</div>

      <button class="auth-btn" style="background: #4267b2;">
        <i class="bi bi-facebook me-2"></i>Facebook ile giriş yap
      </button>

      <a href="#" class="auth-link">Şifrenizi mi unuttunuz?</a>
      <a href="register.html" class="auth-link">Yeni hesap oluştur</a>
    </div>
  </div>

  <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
</body>

</html>
