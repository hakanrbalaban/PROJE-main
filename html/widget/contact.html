<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İletişim | BalabanWidgets</title>
  <meta name="description" content="BalabanWidgets iletişim bilgileri." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">B</span>
      <div>
        <h1 class="brand-name">Balaban<span>Widgets</span></h1>
        <p class="brand-tag">İletişim</p>
      </div>
    </div>
  </header>

  <div class="legal-back"><a href="index.html">← Ana sayfaya dön</a></div>

  <main class="legal-page">
    <h1>İletişim</h1>
    <p>Öneri, hata bildirimi veya iş birliği için aşağıdaki kanallardan ulaşabilirsiniz.</p>

    <h2>E-posta</h2>
    <p><a href="mailto:info@balabanwidgets.com">info@balabanwidgets.com</a></p>

    <h2>İletişim Formu (Demo)</h2>
    <p>Bu form yerel demodur; gönderim backend yoksa çalışmaz.</p>
    <form class="w-tool" action="#" method="post" onsubmit="return false;">
      <label class="w-field">
        <span>Ad Soyad</span>
        <input type="text" name="name" placeholder="Ad Soyad" />
      </label>
      <label class="w-field">
        <span>E-posta</span>
        <input type="email" name="email" placeholder="ornek@mail.com" />
      </label>
      <label class="w-field">
        <span>Mesaj</span>
        <textarea name="message" rows="4" placeholder="Mesajınız..."></textarea>
      </label>
      <button type="submit" class="btn btn-primary">Gönder (Demo)</button>
    </form>
  </main>
</body>
</html>
