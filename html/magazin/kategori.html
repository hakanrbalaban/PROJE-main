<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kategori — Magazinolog</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { ink:'#0f172a', inkier:'#0b1220', brand:'#2563eb', paper:'#f8fafc' },
      fontFamily: { head:['"Barlow Condensed"', 'sans-serif'], body:['Inter', 'sans-serif'] },
      maxWidth: { shell:'1180px' }
    }
  }
}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-ink font-body text-slate-200 antialiased">

<header class="border-b border-white/10 bg-inkier">
  <div class="mx-auto max-w-shell px-4 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <a href="index.html" class="flex items-center gap-2.5 shrink-0">
      <span class="grid place-items-center w-9 h-9 rounded bg-brand font-head text-xl font-bold text-white leading-none pt-0.5">M</span>
      <span class="font-head text-2xl font-bold uppercase tracking-tight text-white">Magazin<span class="text-brand">olog</span></span>
    </a>
    <nav id="catNav" class="flex flex-wrap gap-2 text-[11px] font-bold uppercase tracking-widest"></nav>
  </div>
</header>

<main class="mx-auto max-w-shell px-4 py-8 lg:py-12">
  <div class="flex items-end justify-between border-b border-white/10 pb-3 mb-8">
    <div>
      <p class="text-[11px] uppercase tracking-widest text-slate-500">Kategori</p>
      <h1 id="catTitle" class="font-head text-3xl font-bold uppercase text-white"></h1>
    </div>
    <a href="index.html" class="text-[11px] font-bold uppercase tracking-widest text-slate-400 hover:text-brand transition">Anasayfa</a>
  </div>
  <div id="catGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  <p id="catEmpty" class="hidden text-slate-400 py-16 text-center">Bu kategoride henüz haber yok.</p>
</main>

<script src="articles-data.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var slug = (params.get("cat") || "dunya").toLowerCase();
  var cats = window.VT_CATEGORIES || {};
  var articles = window.VT_ARTICLES || {};
  var cat = cats[slug] || cats.dunya;
  if (!cat) return;

  document.title = cat.name + " — Magazinolog";
  document.getElementById("catTitle").textContent = cat.name;

  var nav = document.getElementById("catNav");
  Object.keys(cats).forEach(function (key) {
    if (key === "gundem") return;
    var c = cats[key];
    var a = document.createElement("a");
    a.href = "kategori.html?cat=" + encodeURIComponent(c.slug);
    a.textContent = c.name;
    a.className = "px-3 py-1.5 border transition " + (c.slug === cat.slug
      ? "bg-brand border-brand text-white"
      : "border-white/15 text-slate-400 hover:border-brand hover:text-white");
    nav.appendChild(a);
  });

  var grid = document.getElementById("catGrid");
  var ids = cat.ids || [];
  if (!ids.length) {
    document.getElementById("catEmpty").classList.remove("hidden");
    return;
  }

  ids.forEach(function (id) {
    var item = articles[id];
    if (!item) return;
    var card = document.createElement("article");
    card.className = "group bg-paper text-ink overflow-hidden";
    card.innerHTML =
      '<a href="article.html?id=' + encodeURIComponent(item.id) + '" class="block h-44 overflow-hidden">' +
      '<img src="' + item.image + '" alt="' + item.title.replace(/"/g, "&quot;") + '" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">' +
      "</a>" +
      '<div class="p-4">' +
      '<p class="text-[10px] font-bold uppercase tracking-widest text-brand mb-1">' + item.categoryLabel + "</p>" +
      '<h2 class="font-head text-lg font-semibold uppercase leading-tight group-hover:text-brand transition">' +
      '<a href="article.html?id=' + encodeURIComponent(item.id) + '">' + item.title + "</a></h2>" +
      '<p class="text-[11px] text-slate-500 mt-2">' + item.date + " · " + item.author + "</p>" +
      "</div>";
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
